[bar.default]
capsule = true
center = []
end = [ "tray", "media", "group:g3", "group:g2", "group:g1", "clock" ]
margin_ends = 0
radius_top_left = 0
radius_top_right = 0
start = [ "workspaces", "active_window" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "cpu", "ram", "temp" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "input_volume" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "network", "bluetooth", "battery" ]
    opacity = 1.0
    padding = 6.0

[control_center]
sidebar = "full"

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@DP-1", "lockscreen-login-box@DP-3" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-1"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-3"]
    box_height = 196.0
    box_width = 810.0
    cx = 1280.0
    cy = 1258.0
    output = "DP-3"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@DP-3".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
lang = "en"

    [shell.panel]
    open_near_click_control_center = true

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Ayu"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kitty" ]
    enable_builtin_templates = true
    enable_community_templates = false

[wallpaper]
directory = "/home/broly/.config/backgrounds"

    [wallpaper.default]
    path = "/home/broly/.config/backgrounds/gta6-dark.jpg"

    [wallpaper.last]
    path = "/home/broly/.config/backgrounds/gta6-dark.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/broly/.config/backgrounds/gta6-dark.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/broly/.config/backgrounds/gta6-dark.jpg"

[widget.active_window]
color = "secondary"

[widget.bluetooth]
capsule = true

[widget.clock]
color = "primary"
format = "{:%a, %b %d %H:%M}"

[widget.cpu]
color = "error"
show_value = false

[widget.input_volume]
color = "secondary"
show_label = false

[widget.media]
hide_when_no_media = true

[widget.network]
capsule = true
show_label = false
show_vpn_label = true

[widget.ram]
color = "error"
label_show_units = false
show_value = false

[widget.sysmon]
color = "error"
show_value = false

[widget.temp]
color = "error"
show_value = false

[widget.tray]
capsule = true

[widget.volume]
color = "secondary"
show_label = false

[widget.workspaces]
empty_color = "on_surface_variant"
focused_color = "tertiary"
labels_only_when_occupied = true
occupied_color = "on_surface"
